# /etc/nginx/sites-available/equipos
# Reemplazá equipos.TUDOMINIO.com por tu subdominio real.
# Este archivo es el PUNTO DE PARTIDA (solo HTTP en el puerto 80).
# Al correr `certbot --nginx -d equipos.TUDOMINIO.com`, certbot agrega
# solo el bloque 443 con los certificados y la redirección.

server {
    listen 80;
    listen [::]:80;
    server_name equipos.TUDOMINIO.com;

    client_max_body_size 2m;

    # Logs propios para no mezclar con los bots
    access_log /var/log/nginx/equipos.access.log;
    error_log  /var/log/nginx/equipos.error.log;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
